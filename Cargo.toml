[package]
authors = ["Victor Berger <victor.berger@m4x.org>", "Drakulix (Victoria Brekenfeld)", "Null (https://github.com/Augusto-p)"]
edition = "2024"
license = "MIT"
name = "PunkWM"
publish = false
version = "0.0.1"

[dependencies]
bitflags = "2.2.1"
fps_ticker = {version = "1.0.0", optional = true}
image = {version = "0.25.1", default-features = false, optional = true, features = ["png"]}
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand","serde"] }
num-traits = "0.2"
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
thiserror = "1"
xcursor = {version = "0.3.3", optional = true}
xkbcommon = "0.8.0"
renderdoc = {version = "0.11.0", optional = true}
puffin_http = { version = "0.13", optional = true }
profiling = { version = "1.0" }
once_cell = "1.21.4"
toml = "1.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
calloop = "0.14.4"
sha2 = "0.10"
chacha20poly1305 = "0.10"
udev = "0.9"

smithay-drm-extras = {
    git = "https://github.com/Smithay/smithay.git",
    package = "smithay-drm-extras",
    optional = true
}
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.32"
walkdir = "2.5.0"
freedesktop-desktop-entry = "0.8.1"




[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "060e9cd9c8ae2633947bdb72cffa1748ac53922d"
default-features = false
features = ["desktop", "wayland_frontend"]

[dependencies.x11rb]
default-features = false
features = ["composite"]
optional = true
version = "0.13.0"

[build-dependencies]
gl_generator = "0.14"

[features]
debug = ["fps_ticker", "image/png", "renderdoc"]
default = ["egl", "xwayland"]
egl = ["smithay/use_system_lib", "smithay/backend_egl"]
test_all_features = ["default", "debug"]
tty = [
  "smithay-drm-extras",
  "smithay/backend_libinput",
  "smithay/backend_udev",
  "smithay/backend_drm",
  "smithay/backend_gbm",
  "smithay/backend_vulkan",
  "smithay/backend_egl",
  "smithay/backend_session_libseat",
  "image",
  "smithay/renderer_gl",
  "smithay/renderer_pixman",
  "smithay/renderer_multi",
  "xcursor",
]

xwayland = ["smithay/xwayland", "x11rb", "smithay/x11rb_event_source", "xcursor"]
profile-with-puffin = ["profiling/profile-with-puffin", "puffin_http"]
profile-with-tracy = ["profiling/profile-with-tracy"]
profile-with-tracy-mem = ["profile-with-tracy"]
renderer_sync = []
